# Default (`docker compose up -d`): only the infrastructure — Postgres + Redis — and you run
# the API / worker / frontend locally.
# Everything in containers: `docker compose --profile full up -d --build`.

x-backend: &backend
  build: ./backend
  profiles: ["full"]
  environment: &backend-env
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/daycompass
    REDIS_URL: redis://redis:6379/0
    JWT_SECRET: ${JWT_SECRET:-REPLACE_WITH_A_LONG_RANDOM_SECRET}
    TZ: ${TZ:-Europe/Athens}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    APP_URL: ${APP_URL:-http://localhost}
    VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
    MAIL_FROM: ${MAIL_FROM:-DayCompass <no-reply@daycompass.local>}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    container_name: daycompass-db
    environment:
      POSTGRES_DB: daycompass
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d daycompass"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: daycompass-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *backend
    container_name: daycompass-api
    ports:
      - "127.0.0.1:8000:8000"

  web:
    # The site itself: `docker compose --profile full up -d --build`, then open http://localhost (or your domain).
    build: ./frontend
    profiles: ["full"]
    container_name: daycompass-web
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    depends_on:
      - api

  worker:
    <<: *backend
    container_name: daycompass-worker
    command: celery -A app.worker.celery_app worker --loglevel=info

  beat:
    <<: *backend
    container_name: daycompass-beat
    command: celery -A app.worker.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule

volumes:
  pgdata:
  caddy_data:
