# Alembic: database migrations. Run from the backend folder.
#   alembic upgrade head        apply every pending migration (what the API container does at start)
#   alembic revision --autogenerate -m "describe the change"   after changing app/domain/models.py
[alembic]
script_location = alembic
prepend_sys_path = .
# the database address comes from app.config (DATABASE_URL), see alembic/env.py

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
qualname =
[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
